<svg viewBox="0 0 1040 410" role="img" aria-label="The processes behind a job: the Claude session, factoryd, the driver, its worktree and agents, the state files and the dashboard" width="1040" height="410" xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><defs><marker id="f3ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f3arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f3arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f3ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><rect class="bgr" x="0" y="0" width="1040" height="410"/><rect class="node n-agent" x="28" y="28" width="180" height="74"/><text class="t" x="118.0" y="53" text-anchor="middle" style="fill:var(--accent-ink)">Claude session</text><text class="s" x="118.0" y="70" text-anchor="middle" style="fill:var(--accent-ink)">/factory writes the</text><text class="s" x="118.0" y="84" text-anchor="middle" style="fill:var(--accent-ink)">spec and the plans</text><rect class="node n-drv" x="28" y="176" width="180" height="68"/><text class="t" x="118.0" y="201" text-anchor="middle" style="fill:var(--driver-ink)">factory CLI</text><text class="s" x="118.0" y="218" text-anchor="middle" style="fill:var(--driver-ink)">new, run, approve,</text><text class="s" x="118.0" y="232" text-anchor="middle" style="fill:var(--driver-ink)">rework, cancel, status</text><rect class="node n-drv" x="300" y="28" width="210" height="100"/><text class="t" x="405.0" y="53" text-anchor="middle" style="fill:var(--driver-ink)">factoryd</text><text class="s" x="405.0" y="70" text-anchor="middle" style="fill:var(--driver-ink)">queue, one child per project</text><text class="s" x="405.0" y="84" text-anchor="middle" style="fill:var(--driver-ink)">daily budget, JSON API :8766</text><rect class="node n-drv" x="300" y="176" width="210" height="68"/><text class="t" x="405.0" y="201" text-anchor="middle" style="fill:var(--driver-ink)">factory run</text><text class="s" x="405.0" y="218" text-anchor="middle" style="fill:var(--driver-ink)">the driver, one per project</text><rect class="node " x="610" y="176" width="190" height="68"/><text class="t" x="705.0" y="201" text-anchor="middle">git worktree</text><text class="s" x="705.0" y="218" text-anchor="middle">factory/NNN, own target dir</text><rect class="node n-agent" x="610" y="290" width="190" height="68"/><text class="t" x="705.0" y="315" text-anchor="middle" style="fill:var(--accent-ink)">claude -p agents</text><text class="s" x="705.0" y="332" text-anchor="middle" style="fill:var(--accent-ink)">builder, committer, reviewer</text><rect class="node n-ok" x="850" y="176" width="164" height="112"/><text class="t" x="932.0" y="201" text-anchor="middle">State files</text><text class="s" x="932.0" y="218" text-anchor="middle">board.json, ledger,</text><text class="s" x="932.0" y="232" text-anchor="middle">events.jsonl, park.json</text><text class="s" x="932.0" y="246" text-anchor="middle">only the driver writes</text><rect class="node " x="850" y="28" width="164" height="100"/><text class="t" x="932.0" y="53" text-anchor="middle">Dashboard</text><text class="s" x="932.0" y="70" text-anchor="middle">port 8765, holds the</text><text class="s" x="932.0" y="84" text-anchor="middle">token, reads the</text><text class="s" x="932.0" y="98" text-anchor="middle">state paths the API gives</text><path class="ar-a" d="M208 64 H298" marker-end="url(#f3ara)"/><text class="lab" x="253" y="56" text-anchor="middle">enqueue</text><path class="ar" d="M118 102 V174" marker-end="url(#f3ar)"/><text class="lab" x="126" y="142" text-anchor="start">factory new</text><path class="ar" d="M208 210 H298" marker-end="url(#f3ar)"/><text class="lab" x="253" y="202" text-anchor="middle">run</text><path class="ar-a" d="M405 128 V174" marker-end="url(#f3ara)"/><text class="lab" x="397" y="156" text-anchor="end">spawns a child</text><path class="ar" d="M510 210 H608" marker-end="url(#f3ar)"/><text class="lab" x="559" y="202" text-anchor="middle">runs in</text><path class="ar" d="M430 244 V324 H608" marker-end="url(#f3ar)"/><text class="lab" x="519" y="340" text-anchor="middle">starts headless</text><path class="ar" d="M705 290 V246" marker-end="url(#f3ar)"/><text class="lab" x="713" y="272" text-anchor="start">edit files</text><path class="ar" d="M490 176 V160 H932 V174" marker-end="url(#f3ar)"/><text class="lab" x="721" y="154" text-anchor="middle">writes</text><path class="ar" d="M848 64 H512" marker-end="url(#f3ar)"/><text class="lab" x="680" y="56" text-anchor="middle">GET /projects, /events, POST</text><rect x="28" y="380" width="14" height="14" class="node n-agent"/><text class="cap" x="50" y="392">spends LLM tokens</text><rect x="198" y="380" width="14" height="14" class="node n-drv"/><text class="cap" x="220" y="392">Rust driver, no tokens</text><rect x="408" y="380" width="14" height="14" class="node n-warn"/><text class="cap" x="430" y="392">stops for a human</text></svg>
