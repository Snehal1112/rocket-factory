<svg viewBox="0 0 1040 516" role="img" aria-label="A rocket-factory job from the /factory command to a merge, with fix rounds and the needs-human stop" width="1040" height="516" xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><defs><marker id="f1ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f1arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f1arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f1ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><rect class="bgr" x="0" y="0" width="1040" height="516"/><rect class="band" x="10" y="14" width="1020" height="160"/><text class="m" x="26" y="36">YOU, IN A CLAUDE SESSION</text><rect class="node " x="28" y="54" width="150" height="68"/><text class="t" x="103.0" y="79" text-anchor="middle">/factory</text><text class="s" x="103.0" y="96" text-anchor="middle">you type a feature</text><rect class="node n-agent" x="216" y="54" width="150" height="68"/><text class="t" x="291.0" y="79" text-anchor="middle" style="fill:var(--accent-ink)">Spec</text><text class="s" x="291.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">interview, you approve</text><rect class="node n-agent" x="404" y="54" width="150" height="68"/><text class="t" x="479.0" y="79" text-anchor="middle" style="fill:var(--accent-ink)">Plans</text><text class="s" x="479.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">max 3 tasks, you approve</text><rect class="node n-drv" x="592" y="54" width="150" height="68"/><text class="t" x="667.0" y="79" text-anchor="middle" style="fill:var(--driver-ink)">factory new</text><text class="s" x="667.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">lints, one job per plan</text><rect class="node n-drv" x="780" y="54" width="150" height="68"/><text class="t" x="855.0" y="79" text-anchor="middle" style="fill:var(--driver-ink)">Start the run</text><text class="s" x="855.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">factoryd enqueue, else</text><text class="s" x="855.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">factory run in background</text><path class="ar" d="M178 88 H214" marker-end="url(#f1ar)"/><path class="ar" d="M366 88 H402" marker-end="url(#f1ar)"/><path class="ar" d="M554 88 H590" marker-end="url(#f1ar)"/><path class="ar" d="M742 88 H778" marker-end="url(#f1ar)"/><path class="ar-a" d="M855 122 V148 H103 V232" marker-end="url(#f1ara)"/><text class="lab" x="479" y="142" text-anchor="middle">factory run &lt;id&gt; --series</text><rect class="band" x="10" y="186" width="1020" height="224"/><text class="m" x="26" y="400">THE DRIVER AND THE AGENTS IT STARTS, IN A GIT WORKTREE</text><rect class="node n-drv" x="28" y="232" width="118" height="72"/><text class="t" x="87.0" y="257" text-anchor="middle" style="fill:var(--driver-ink)">Worktree</text><text class="s" x="87.0" y="274" text-anchor="middle" style="fill:var(--driver-ink)">branch factory/NNN</text><rect class="node n-agent" x="168" y="232" width="118" height="72"/><text class="t" x="227.0" y="257" text-anchor="middle" style="fill:var(--accent-ink)">Build</text><text class="s" x="227.0" y="274" text-anchor="middle" style="fill:var(--accent-ink)">builder, one per task</text><rect class="node n-agent" x="308" y="232" width="118" height="72"/><text class="t" x="367.0" y="257" text-anchor="middle" style="fill:var(--accent-ink)">Commit</text><text class="s" x="367.0" y="274" text-anchor="middle" style="fill:var(--accent-ink)">committer, one batch</text><rect class="node n-drv" x="448" y="232" width="118" height="72"/><text class="t" x="507.0" y="257" text-anchor="middle" style="fill:var(--driver-ink)">Checks</text><text class="s" x="507.0" y="274" text-anchor="middle" style="fill:var(--driver-ink)">cargo, yarn per crate</text><rect class="node n-agent" x="588" y="232" width="118" height="72"/><text class="t" x="647.0" y="257" text-anchor="middle" style="fill:var(--accent-ink)">Review</text><text class="s" x="647.0" y="274" text-anchor="middle" style="fill:var(--accent-ink)">reviewer, read-only</text><rect class="node n-drv" x="728" y="232" width="118" height="72"/><text class="t" x="787.0" y="257" text-anchor="middle" style="fill:var(--driver-ink)">Decide</text><text class="s" x="787.0" y="274" text-anchor="middle" style="fill:var(--driver-ink)">risk, budget, size,</text><text class="s" x="787.0" y="288" text-anchor="middle" style="fill:var(--driver-ink)">checks, verdict</text><rect class="node n-drv" x="868" y="232" width="118" height="72"/><text class="t" x="927.0" y="257" text-anchor="middle" style="fill:var(--driver-ink)">Merge</text><text class="s" x="927.0" y="274" text-anchor="middle" style="fill:var(--driver-ink)">no-ff into base</text><path class="ar" d="M146 268 H166" marker-end="url(#f1ar)"/><path class="ar" d="M286 268 H306" marker-end="url(#f1ar)"/><path class="ar" d="M426 268 H446" marker-end="url(#f1ar)"/><path class="ar" d="M566 268 H586" marker-end="url(#f1ar)"/><path class="ar" d="M706 268 H726" marker-end="url(#f1ar)"/><path class="ar" d="M846 268 H866" marker-end="url(#f1ar)"/><path class="ar-b" d="M507 232 V218 H227 V230" marker-end="url(#f1arb)"/><text class="lab" x="367" y="213" text-anchor="middle">red check: fix round</text><path class="ar-w" d="M647 232 V202 H187 V230" marker-end="url(#f1arw)"/><text class="lab" x="417" y="197" text-anchor="middle">CHANGES: fix round</text><rect class="node n-warn" x="28" y="424" width="958" height="50"/><text class="t" x="507" y="446" text-anchor="middle" style="fill:var(--warn)">needs-human</text><text class="tw" x="507" y="464" text-anchor="middle">checks failed twice, no checks ran, no tests added, risky diff, changes remain, main busy</text><path class="ar-w" d="M507 304 V422" marker-end="url(#f1arw)"/><path class="ar-w" d="M647 304 V422" marker-end="url(#f1arw)"/><path class="ar-w" d="M787 304 V422" marker-end="url(#f1arw)"/><path class="ar-w" d="M927 304 V422" marker-end="url(#f1arw)"/><rect x="28" y="490" width="14" height="14" class="node n-agent"/><text class="cap" x="50" y="502">spends LLM tokens</text><rect x="198" y="490" width="14" height="14" class="node n-drv"/><text class="cap" x="220" y="502">Rust driver, no tokens</text><rect x="408" y="490" width="14" height="14" class="node n-warn"/><text class="cap" x="430" y="502">stops for a human</text></svg>
