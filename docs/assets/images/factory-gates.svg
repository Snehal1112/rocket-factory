<svg viewBox="0 0 1040 776" role="img" aria-label="The gates a job passes in order: scope, checks, unchecked code, tests, reviewer, decide, final checks and merge, with the outcome of each" width="1040" height="776" xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><rect class="bgr" x="0" y="0" width="1040" height="696"/><defs><marker id="f2ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f2arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f2arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f2ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><text class="m" x="22" y="26">BEFORE THE REVIEWER</text><circle class="num" cx="40" cy="68" r="15"/><text class="numt" x="40" y="73" text-anchor="middle">1</text><rect class="node n-drv" x="72" y="40" width="250" height="56"/><text class="t" x="197.0" y="65" text-anchor="middle" style="fill:var(--driver-ink)">Scope gate</text><text class="s" x="197.0" y="82" text-anchor="middle" style="fill:var(--driver-ink)">changed files stay in the plan</text><path class="ar" d="M322 68 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="40" width="620" height="56"/><text class="cap" x="416" y="72">a file outside the plan scope: park out-of-scope, before any check runs</text><circle class="num" cx="40" cy="142" r="15"/><text class="numt" x="40" y="147" text-anchor="middle">2</text><rect class="node n-drv" x="72" y="114" width="250" height="56"/><text class="t" x="197.0" y="139" text-anchor="middle" style="fill:var(--driver-ink)">Run mapped checks</text><text class="s" x="197.0" y="156" text-anchor="middle" style="fill:var(--driver-ink)">cargo and yarn per touched crate</text><path class="ar" d="M322 142 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="114" width="620" height="56"/><text class="cap" x="416" y="138">any FAIL: fix round (2 at most, risky_fix_rounds for a risky diff), then park</text><text class="cap" x="416" y="154">checks-failed. A later round can use a fresh builder on a stronger model.</text><circle class="num" cx="40" cy="216" r="15"/><text class="numt" x="40" y="221" text-anchor="middle">3</text><rect class="node n-drv" x="72" y="188" width="250" height="56"/><text class="t" x="197.0" y="213" text-anchor="middle" style="fill:var(--driver-ink)">Unchecked-code gate</text><text class="s" x="197.0" y="230" text-anchor="middle" style="fill:var(--driver-ink)">replaces the no-checks gate</text><path class="ar" d="M322 216 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="188" width="620" height="56"/><text class="cap" x="416" y="212">a changed code path with no check rule: park no-checks, risky diffs too.</text><text class="cap" x="416" y="228">Paths marked unchecked are exempt.</text><circle class="num" cx="40" cy="290" r="15"/><text class="numt" x="40" y="295" text-anchor="middle">4</text><rect class="node n-drv" x="72" y="262" width="250" height="56"/><text class="t" x="197.0" y="287" text-anchor="middle" style="fill:var(--driver-ink)">No-tests gate</text><text class="s" x="197.0" y="304" text-anchor="middle" style="fill:var(--driver-ink)">runs once, before the review</text><path class="ar" d="M322 290 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="262" width="620" height="56"/><text class="cap" x="416" y="286">no test path or added test marker: warn the reviewer, or park no-tests when</text><text class="cap" x="416" y="302">require_tests is on</text><text class="m" x="72" y="348">REVIEW, DECISION AND MERGE</text><circle class="num" cx="40" cy="390" r="15"/><text class="numt" x="40" y="395" text-anchor="middle">5</text><rect class="node n-agent" x="72" y="362" width="250" height="56"/><text class="t" x="197.0" y="387" text-anchor="middle" style="fill:var(--accent-ink)">Reviewer</text><text class="s" x="197.0" y="404" text-anchor="middle" style="fill:var(--accent-ink)">read-only, one pass</text><path class="ar" d="M322 390 H398" marker-end="url(#f2ar)"/><rect class="node " x="400" y="362" width="620" height="56"/><text class="cap" x="416" y="386">last line must be VERDICT: APPROVE or VERDICT: CHANGES, anything else counts as</text><text class="cap" x="416" y="402">CHANGES. Findings are graded blocker or minor.</text><circle class="num" cx="40" cy="464" r="15"/><text class="numt" x="40" y="469" text-anchor="middle">6</text><rect class="node n-drv" x="72" y="436" width="250" height="56"/><text class="t" x="197.0" y="461" text-anchor="middle" style="fill:var(--driver-ink)">decide()</text><text class="s" x="197.0" y="478" text-anchor="middle" style="fill:var(--driver-ink)">the order matters</text><path class="ar" d="M322 464 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="436" width="620" height="56"/><text class="cap" x="416" y="460">budget stopped or over the size cap: park. Checks red or CHANGES: fix round, then</text><text class="cap" x="416" y="476">park. Only an APPROVE on a risky diff parks as risky-diff, and that comes last.</text><circle class="num" cx="40" cy="538" r="15"/><text class="numt" x="40" y="543" text-anchor="middle">7</text><rect class="node n-drv" x="72" y="510" width="250" height="56"/><text class="t" x="197.0" y="535" text-anchor="middle" style="fill:var(--driver-ink)">Final checks on head</text><text class="s" x="197.0" y="552" text-anchor="middle" style="fill:var(--driver-ink)">checks and unchecked gate</text><path class="ar" d="M322 538 H398" marker-end="url(#f2ar)"/><rect class="node n-warn" x="400" y="510" width="620" height="56"/><text class="cap" x="416" y="534">FAIL: fix round, also for a risky approve, which parks only after this step.</text><text class="cap" x="416" y="550">Code with no check mapped: park no-checks. The no-tests gate does not run again.</text><circle class="num" cx="40" cy="612" r="15"/><text class="numt" x="40" y="617" text-anchor="middle">8</text><rect class="node n-drv" x="72" y="584" width="250" height="56"/><text class="t" x="197.0" y="609" text-anchor="middle" style="fill:var(--driver-ink)">Ledger and approve</text><text class="s" x="197.0" y="626" text-anchor="middle" style="fill:var(--driver-ink)">checks ran: &lt;commands&gt;</text><path class="ar" d="M322 612 H398" marker-end="url(#f2ar)"/><rect class="node n-ok" x="400" y="584" width="620" height="56"/><text class="cap" x="416" y="616">writes the ledger line and moves the job to approve</text><circle class="num" cx="40" cy="686" r="15"/><text class="numt" x="40" y="691" text-anchor="middle">9</text><rect class="node n-drv" x="72" y="658" width="250" height="56"/><text class="t" x="197.0" y="683" text-anchor="middle" style="fill:var(--driver-ink)">Merge stage</text><text class="s" x="197.0" y="700" text-anchor="middle" style="fill:var(--driver-ink)">no-ff, sync, bookkeeping</text><path class="ar" d="M322 686 H398" marker-end="url(#f2ar)"/><rect class="node n-ok" x="400" y="658" width="620" height="56"/><text class="cap" x="416" y="682">park on: main busy, tip changed, lock held. Base moved: sync, 2 at most, can park.</text><text class="cap" x="416" y="698">Else merged, plan ticked, waiver and minor-finding tickets filed.</text><path class="ar" d="M40 83 V127" marker-end="url(#f2ar)"/><path class="ar" d="M40 157 V201" marker-end="url(#f2ar)"/><path class="ar" d="M40 231 V275" marker-end="url(#f2ar)"/><path class="ar" d="M40 305 V375" marker-end="url(#f2ar)"/><path class="ar" d="M40 405 V449" marker-end="url(#f2ar)"/><path class="ar" d="M40 479 V523" marker-end="url(#f2ar)"/><path class="ar" d="M40 553 V597" marker-end="url(#f2ar)"/><path class="ar" d="M40 627 V671" marker-end="url(#f2ar)"/><rect x="22" y="744" width="14" height="14" class="node n-agent"/><text class="cap" x="44" y="756">spends LLM tokens</text><rect x="192" y="744" width="14" height="14" class="node n-drv"/><text class="cap" x="214" y="756">Rust driver, no tokens</text><rect x="402" y="744" width="14" height="14" class="node n-warn"/><text class="cap" x="424" y="756">stops for a human</text></svg>
