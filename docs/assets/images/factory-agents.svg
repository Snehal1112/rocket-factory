<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 552" role="img" aria-label="How the driver starts one claude -p agent, how a run ends, and the five roles it starts" width="1040" height="552"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><defs><marker id="f4ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f4arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f4arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f4ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><rect class="bgr" x="0" y="0" width="1040" height="552"/><rect class="band" x="10" y="14" width="1020" height="170"/><text class="m" x="26" y="36">ONE AGENT RUN</text><rect class="node n-drv" x="28" y="52" width="200" height="118"/><text class="t" x="128.0" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Driver</text><text class="s" x="128.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">run_agent in the engine</text><text class="s" x="128.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">writes the agent files</text><text class="s" x="128.0" y="124" text-anchor="middle" style="fill:var(--driver-ink)">sets the cache TTL variable</text><text class="s" x="128.0" y="138" text-anchor="middle" style="fill:var(--driver-ink)">passes used_before and budget</text><rect class="node n-agent" x="270" y="52" width="330" height="118"/><text class="t" x="435.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">claude -p</text><text class="s" x="435.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">--output-format stream-json --verbose</text><text class="s" x="435.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">--model, --resume, --permission-mode</text><text class="s" x="435.0" y="124" text-anchor="middle" style="fill:var(--accent-ink)">--allowedTools, --tools, --agent</text><text class="s" x="435.0" y="138" text-anchor="middle" style="fill:var(--accent-ink)">--max-turns, cwd = the job worktree</text><text class="s" x="435.0" y="152" text-anchor="middle" style="fill:var(--accent-ink)">prompt on stdin, API keys removed</text><rect class="node n-drv" x="640" y="52" width="170" height="118"/><text class="t" x="725.0" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Stream reader</text><text class="s" x="725.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">one JSON line at a time</text><text class="s" x="725.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">latest session id</text><text class="s" x="725.0" y="124" text-anchor="middle" style="fill:var(--driver-ink)">usage, result, stop reason</text><rect class="node n-ok" x="850" y="52" width="164" height="118"/><text class="t" x="932.0" y="77" text-anchor="middle" >Records</text><text class="s" x="932.0" y="96" text-anchor="middle" >events.jsonl</text><text class="s" x="932.0" y="110" text-anchor="middle" >usage.jsonl</text><text class="s" x="932.0" y="124" text-anchor="middle" >job token tally</text><path class="ar-a" d="M228 111 H268" marker-end="url(#f4ara)"/><text class="lab" x="248" y="103" text-anchor="middle">spawns</text><path class="ar" d="M600 111 H638" marker-end="url(#f4ar)"/><text class="lab" x="619" y="103" text-anchor="middle">stdout</text><path class="ar" d="M810 111 H848" marker-end="url(#f4ar)"/><text class="lab" x="829" y="103" text-anchor="middle">writes</text><path class="ar-w" d="M725 170 V196" marker-end="url(#f4arw)"/><rect class="band" x="10" y="198" width="1020" height="108"/><text class="m" x="26" y="220">HOW A RUN ENDS</text><rect class="node n-ok" x="28" y="232" width="184" height="60"/><text class="t" x="120.0" y="257" text-anchor="middle" >Done</text><text class="s" x="120.0" y="276" text-anchor="middle" >result line, no error</text><rect class="node n-warn" x="227" y="232" width="184" height="60"/><text class="t" x="319.0" y="257" text-anchor="middle" >Budget stop</text><text class="s" x="319.0" y="276" text-anchor="middle" >80% warns, 100% kills</text><rect class="node n-warn" x="426" y="232" width="184" height="60"/><text class="t" x="518.0" y="257" text-anchor="middle" >Stalled</text><text class="s" x="518.0" y="276" text-anchor="middle" >10 min with no output</text><rect class="node n-warn" x="625" y="232" width="184" height="60"/><text class="t" x="717.0" y="257" text-anchor="middle" >Turn limit</text><text class="s" x="717.0" y="276" text-anchor="middle" >max-turns reached</text><rect class="node n-warn" x="824" y="232" width="184" height="60"/><text class="t" x="916.0" y="257" text-anchor="middle" >Failed</text><text class="s" x="916.0" y="276" text-anchor="middle" >exit with no result</text><text class="s" x="916.0" y="290" text-anchor="middle" >or an error result</text><rect class="band" x="10" y="320" width="1020" height="190"/><text class="m" x="26" y="342">ROLES THE DRIVER STARTS</text><rect class="node n-agent" x="28" y="356" width="184" height="124"/><text class="t" x="120.0" y="381" text-anchor="middle" style="fill:var(--accent-ink)">Builder</text><text class="s" x="120.0" y="400" text-anchor="middle" style="fill:var(--accent-ink)">fresh per task, resumed to fix</text><text class="s" x="120.0" y="414" text-anchor="middle" style="fill:var(--accent-ink)">acceptEdits and an allowlist</text><text class="s" x="120.0" y="428" text-anchor="middle" style="fill:var(--accent-ink)">120 turns, has the Agent tool</text><text class="s" x="120.0" y="442" text-anchor="middle" style="fill:var(--accent-ink)">helper cap: prompt only</text><text class="s" x="120.0" y="456" text-anchor="middle" style="fill:var(--accent-ink)">tampering parks the job</text><rect class="node n-agent" x="227" y="356" width="184" height="124"/><text class="t" x="319.0" y="381" text-anchor="middle" style="fill:var(--accent-ink)">Reviewer</text><text class="s" x="319.0" y="400" text-anchor="middle" style="fill:var(--accent-ink)">fresh each round</text><text class="s" x="319.0" y="414" text-anchor="middle" style="fill:var(--accent-ink)">read-only, 40 turns</text><text class="s" x="319.0" y="428" text-anchor="middle" style="fill:var(--accent-ink)">Read, Grep, Glob only</text><text class="s" x="319.0" y="442" text-anchor="middle" style="fill:var(--accent-ink)">no subagents</text><rect class="node n-agent" x="426" y="356" width="184" height="124"/><text class="t" x="518.0" y="381" text-anchor="middle" style="fill:var(--accent-ink)">Committer</text><text class="s" x="518.0" y="400" text-anchor="middle" style="fill:var(--accent-ink)">one batch commit</text><text class="s" x="518.0" y="414" text-anchor="middle" style="fill:var(--accent-ink)">Bash, Read, Skill</text><text class="s" x="518.0" y="428" text-anchor="middle" style="fill:var(--accent-ink)">no subagents by default</text><text class="s" x="518.0" y="442" text-anchor="middle" style="fill:var(--accent-ink)">resumed once if bad</text><rect class="node n-agent" x="625" y="356" width="184" height="124"/><text class="t" x="717.0" y="381" text-anchor="middle" style="fill:var(--accent-ink)">Message writer</text><text class="s" x="717.0" y="400" text-anchor="middle" style="fill:var(--accent-ink)">merge and sync text</text><text class="s" x="717.0" y="414" text-anchor="middle" style="fill:var(--accent-ink)">Read, Skill, read-only</text><text class="s" x="717.0" y="428" text-anchor="middle" style="fill:var(--accent-ink)">no subagents</text><text class="s" x="717.0" y="442" text-anchor="middle" style="fill:var(--accent-ink)">resumed once if bad</text><rect class="node n-agent" x="824" y="356" width="184" height="124"/><text class="t" x="916.0" y="381" text-anchor="middle" style="fill:var(--accent-ink)">KB refresher</text><text class="s" x="916.0" y="400" text-anchor="middle" style="fill:var(--accent-ink)">after a merge, 80 turns</text><text class="s" x="916.0" y="414" text-anchor="middle" style="fill:var(--accent-ink)">has the Agent tool</text><text class="s" x="916.0" y="428" text-anchor="middle" style="fill:var(--accent-ink)">up to 3 subagents</text><text class="s" x="916.0" y="442" text-anchor="middle" style="fill:var(--accent-ink)">KB folder edits only</text><text class="cap" x="28" y="500">Only the builder and the KB refresher can start subagents. The driver does not count or limit the builder's helpers.</text><rect x="28" y="526" width="14" height="14" class="node n-agent"/><text class="cap" x="50" y="538">spends LLM tokens</text><rect x="198" y="526" width="14" height="14" class="node n-drv"/><text class="cap" x="220" y="538">Rust driver, no tokens</text><rect x="408" y="526" width="14" height="14" class="node n-warn"/><text class="cap" x="430" y="538">stops for a human</text></svg>