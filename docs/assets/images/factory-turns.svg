<svg viewBox="0 0 1040 572" role="img" aria-label="The agent runs of one job in order, the fix round loop, the early stops and the rework turn" width="1040" height="572" xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><rect class="bgr" x="0" y="0" width="1040" height="572"/><defs><marker id="f5ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f5arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f5arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f5ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><rect class="band" x="10" y="14" width="1020" height="150"/><text class="m" x="26" y="36">ONE JOB WITH N TASKS, THE MAIN LINE</text><rect class="node n-agent" x="33" y="52" width="123" height="70"/><text class="t" x="94.5" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build 1</text><text class="s" x="94.5" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="94.5" y="110" text-anchor="middle" style="fill:var(--accent-ink)">task 1</text><rect class="node n-agent" x="174" y="52" width="123" height="70"/><text class="t" x="235.5" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build 2</text><text class="s" x="235.5" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh or carried</text><text class="s" x="235.5" y="110" text-anchor="middle" style="fill:var(--accent-ink)">task 2</text><rect class="node n-agent" x="315" y="52" width="123" height="70"/><text class="t" x="376.5" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build N</text><text class="s" x="376.5" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh or carried</text><text class="s" x="376.5" y="110" text-anchor="middle" style="fill:var(--accent-ink)">last task</text><rect class="node n-drv" x="456" y="52" width="123" height="70"/><text class="t" x="517.5" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Checks</text><text class="s" x="517.5" y="96" text-anchor="middle" style="fill:var(--driver-ink)">cargo, yarn</text><text class="s" x="517.5" y="110" text-anchor="middle" style="fill:var(--driver-ink)">per crate</text><rect class="node n-agent" x="597" y="52" width="123" height="70"/><text class="t" x="658.5" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Reviewer</text><text class="s" x="658.5" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="658.5" y="110" text-anchor="middle" style="fill:var(--accent-ink)">one pass</text><rect class="node n-drv" x="738" y="52" width="123" height="70"/><text class="t" x="799.5" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Final</text><text class="s" x="799.5" y="96" text-anchor="middle" style="fill:var(--driver-ink)">checks again</text><text class="s" x="799.5" y="110" text-anchor="middle" style="fill:var(--driver-ink)">on the head</text><rect class="node n-drv" x="879" y="52" width="123" height="70"/><text class="t" x="940.5" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Merge</text><text class="s" x="940.5" y="96" text-anchor="middle" style="fill:var(--driver-ink)">driver writes the</text><text class="s" x="940.5" y="110" text-anchor="middle" style="fill:var(--driver-ink)">message from notes</text><path class="ar" d="M156 87 H174" marker-end="url(#f5ar)"/><path class="ar" d="M297 87 H315" marker-end="url(#f5ar)"/><path class="ar" d="M438 87 H456" marker-end="url(#f5ar)"/><path class="ar" d="M579 87 H597" marker-end="url(#f5ar)"/><path class="ar" d="M720 87 H738" marker-end="url(#f5ar)"/><path class="ar" d="M861 87 H879" marker-end="url(#f5ar)"/><text class="lab" x="33" y="146">after each build the driver makes a wip snapshot commit and keeps the builder's commit note, no agent</text><path class="ar-w" d="M517.5 122 V170 H128 V222" marker-end="url(#f5arw)"/><text class="lab" x="340" y="166" text-anchor="middle">red check</text><path class="ar-w" d="M658.5 122 V180 H170 V222" marker-end="url(#f5arw)"/><text class="lab" x="440" y="176" text-anchor="middle">CHANGES verdict</text><rect class="band" x="10" y="186" width="1020" height="116"/><text class="m" x="1014" y="208" text-anchor="end">FIX ROUND, 2 AT MOST, THE THIRD PARKS</text><rect class="node n-warn" x="33" y="224" width="250" height="66"/><text class="t" x="158.0" y="249" text-anchor="middle" >Fix needed</text><text class="s" x="158.0" y="268" text-anchor="middle" >red check or CHANGES</text><text class="s" x="158.0" y="282" text-anchor="middle" >findings go to a file</text><rect class="node n-agent" x="333" y="224" width="300" height="66"/><text class="t" x="483.0" y="249" text-anchor="middle" style="fill:var(--accent-ink)">Builder, resumed</text><text class="s" x="483.0" y="268" text-anchor="middle" style="fill:var(--accent-ink)">fresh on fix 2, stronger model</text><text class="s" x="483.0" y="282" text-anchor="middle" style="fill:var(--accent-ink)">reads changes-rN.md</text><rect class="node n-drv" x="683" y="224" width="331" height="66"/><text class="t" x="848.5" y="249" text-anchor="middle" style="fill:var(--driver-ink)">Back to checks</text><text class="s" x="848.5" y="268" text-anchor="middle" style="fill:var(--driver-ink)">then review, as in the main line</text><text class="s" x="848.5" y="282" text-anchor="middle" style="fill:var(--driver-ink)">the final checks can start one too</text><path class="ar" d="M283 257 H331" marker-end="url(#f5ar)"/><path class="ar" d="M633 257 H681" marker-end="url(#f5ar)"/><rect class="band" x="10" y="316" width="1020" height="130"/><text class="m" x="26" y="334">OTHER TURNS AND STOPS</text><rect class="node n-warn" x="33" y="346" width="300" height="86"/><text class="t" x="183.0" y="371" text-anchor="middle" >Builder stops early</text><text class="s" x="183.0" y="390" text-anchor="middle" >timeout, budget, turn limit or crash:</text><text class="s" x="183.0" y="404" text-anchor="middle" >parks BuilderStopped, no auto retry</text><text class="s" x="183.0" y="418" text-anchor="middle" >BLOCKED status: parks BuilderBlocked</text><rect class="node n-warn" x="353" y="346" width="300" height="86"/><text class="t" x="503.0" y="371" text-anchor="middle" >Nothing changed</text><text class="s" x="503.0" y="390" text-anchor="middle" >no diff after a build parks</text><text class="s" x="503.0" y="404" text-anchor="middle" >NothingChanged. After a fix round for</text><text class="s" x="503.0" y="418" text-anchor="middle" >a red check, a green rerun passes on.</text><rect class="node n-agent" x="673" y="346" width="341" height="86"/><text class="t" x="843.5" y="371" text-anchor="middle" style="fill:var(--accent-ink)">factory rework</text><text class="s" x="843.5" y="390" text-anchor="middle" style="fill:var(--accent-ink)">all tasks done: next round, changes-r(N+1).md</text><text class="s" x="843.5" y="404" text-anchor="middle" style="fill:var(--accent-ink)">your note first, then open findings, fresh fix rounds</text><text class="s" x="843.5" y="418" text-anchor="middle" style="fill:var(--accent-ink)">task pending: the same task re-runs with the note</text><rect class="node n-ok" x="33" y="462" width="981" height="68"/><text class="cap" x="523" y="484" text-anchor="middle">No agent runs for commits or messages: the driver makes the commits and writes the merge message.</text><text class="cap" x="523" y="500" text-anchor="middle">Add 1 for the spec review at factory new. The 1,000,000 weighted token budget stops a long job.</text><text class="cap" x="523" y="516" text-anchor="middle">At most N + 2 builder runs, 3 runs per review role and 1 spec review, with fix_rounds = 2.</text><rect x="28" y="546" width="14" height="14" class="node n-agent"/><text class="cap" x="50" y="558">spends LLM tokens</text><rect x="198" y="546" width="14" height="14" class="node n-drv"/><text class="cap" x="220" y="558">Rust driver, no tokens</text><rect x="408" y="546" width="14" height="14" class="node n-warn"/><text class="cap" x="430" y="558">stops for a human</text></svg>