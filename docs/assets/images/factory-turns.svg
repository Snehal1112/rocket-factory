<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 556" role="img" aria-label="The agent runs of one job in order, the fix round loop, the early stops and the rework turn" width="1040" height="556"><style>:root{--paper:#e9eeec;--panel:#f6f8f7;--ink:#142129;--ink2:#4a5b64;--line:#c5d0cd;--accent:#e0a800;--accent-ink:#241a00;--driver:#1d5c73;--driver-ink:#f2fafc;--ok:#1f7a4d;--ok-soft:#d6ebde;--warn:#a35f00;--warn-soft:#f2e2c6;--bad:#b3372f}@media (prefers-color-scheme: dark){:root{--paper:#0e171c;--panel:#162329;--ink:#e4edf0;--ink2:#93a6ae;--line:#28383f;--accent:#f0bd1c;--accent-ink:#1d1500;--driver:#5db7d4;--driver-ink:#06222c;--ok:#4cc38a;--ok-soft:#133224;--warn:#e9a23b;--warn-soft:#33260f;--bad:#f0746b}}
.bgr{fill:var(--paper)}
.band{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.n-agent{fill:var(--accent)}
.n-drv{fill:var(--driver)}
.n-warn{fill:var(--warn-soft);stroke:var(--warn)}
.n-ok{fill:var(--ok-soft);stroke:var(--ok)}
.t{fill:var(--ink);font:800 17px "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.s{fill:var(--ink2);font:400 12px "IBM Plex Sans",system-ui,sans-serif}
.m{fill:var(--ink2);font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em}
.lab{fill:var(--ink2);font:500 11px "IBM Plex Mono",ui-monospace,monospace}
.tw{fill:var(--warn);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace}
.ar{fill:none;stroke:var(--ink2);stroke-width:1.8}
.ar-w{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:6 4}
.ar-b{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-dasharray:6 4}
.ar-a{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink2)}.mkw{fill:var(--warn)}.mkb{fill:var(--bad)}.mka{fill:var(--ink)}
.num{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.numt{fill:var(--ink);font:800 15px "Big Shoulders Display","Arial Narrow",Impact,sans-serif}
.cap{fill:var(--ink);font:500 12px "IBM Plex Sans",system-ui,sans-serif}
</style><defs><marker id="f5ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="f5arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkw"/></marker><marker id="f5arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mkb"/></marker><marker id="f5ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs><rect class="bgr" x="0" y="0" width="1040" height="556"/><rect class="band" x="10" y="14" width="1020" height="150"/><text class="m" x="26" y="36">ONE JOB WITH N TASKS, THE MAIN LINE</text><rect class="node n-agent" x="33" y="52" width="106" height="70"/><text class="t" x="86.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build 1</text><text class="s" x="86.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="86.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">task 1</text><rect class="node n-agent" x="157" y="52" width="106" height="70"/><text class="t" x="210.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build 2</text><text class="s" x="210.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="210.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">task 2</text><rect class="node n-agent" x="281" y="52" width="106" height="70"/><text class="t" x="334.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Build N</text><text class="s" x="334.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="334.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">last task</text><rect class="node n-agent" x="405" y="52" width="106" height="70"/><text class="t" x="458.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Committer</text><text class="s" x="458.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">one batch</text><text class="s" x="458.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">commit</text><rect class="node n-drv" x="529" y="52" width="106" height="70"/><text class="t" x="582.0" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Checks</text><text class="s" x="582.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">cargo, yarn</text><text class="s" x="582.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">per crate</text><rect class="node n-agent" x="653" y="52" width="106" height="70"/><text class="t" x="706.0" y="77" text-anchor="middle" style="fill:var(--accent-ink)">Reviewer</text><text class="s" x="706.0" y="96" text-anchor="middle" style="fill:var(--accent-ink)">fresh run</text><text class="s" x="706.0" y="110" text-anchor="middle" style="fill:var(--accent-ink)">one pass</text><rect class="node n-drv" x="777" y="52" width="106" height="70"/><text class="t" x="830.0" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Final</text><text class="s" x="830.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">checks again</text><text class="s" x="830.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">on the head</text><rect class="node n-drv" x="901" y="52" width="106" height="70"/><text class="t" x="954.0" y="77" text-anchor="middle" style="fill:var(--driver-ink)">Merge</text><text class="s" x="954.0" y="96" text-anchor="middle" style="fill:var(--driver-ink)">message agent</text><text class="s" x="954.0" y="110" text-anchor="middle" style="fill:var(--driver-ink)">writes the text</text><path class="ar" d="M139 87 H157" marker-end="url(#f5ar)"/><path class="ar" d="M263 87 H281" marker-end="url(#f5ar)"/><path class="ar" d="M387 87 H405" marker-end="url(#f5ar)"/><path class="ar" d="M511 87 H529" marker-end="url(#f5ar)"/><path class="ar" d="M635 87 H653" marker-end="url(#f5ar)"/><path class="ar" d="M759 87 H777" marker-end="url(#f5ar)"/><path class="ar" d="M883 87 H901" marker-end="url(#f5ar)"/><text class="lab" x="33" y="146">after each build the driver makes a wip snapshot commit, no agent</text><path class="ar-w" d="M582 122 V170 H128 V222" marker-end="url(#f5arw)"/><text class="lab" x="340" y="166" text-anchor="middle">red check</text><path class="ar-w" d="M706 122 V180 H170 V222" marker-end="url(#f5arw)"/><text class="lab" x="440" y="176" text-anchor="middle">CHANGES verdict</text><rect class="band" x="10" y="186" width="1020" height="116"/><text class="m" x="1014" y="208" text-anchor="end">FIX ROUND, 2 AT MOST, THE THIRD PARKS</text><rect class="node n-warn" x="33" y="224" width="190" height="66"/><text class="t" x="128.0" y="249" text-anchor="middle" >Fix needed</text><text class="s" x="128.0" y="268" text-anchor="middle" >red check or CHANGES</text><text class="s" x="128.0" y="282" text-anchor="middle" >findings go to a file</text><rect class="node n-agent" x="273" y="224" width="190" height="66"/><text class="t" x="368.0" y="249" text-anchor="middle" style="fill:var(--accent-ink)">Builder, resumed</text><text class="s" x="368.0" y="268" text-anchor="middle" style="fill:var(--accent-ink)">same session continues</text><text class="s" x="368.0" y="282" text-anchor="middle" style="fill:var(--accent-ink)">reads changes-rN.md</text><rect class="node n-agent" x="513" y="224" width="190" height="66"/><text class="t" x="608.0" y="249" text-anchor="middle" style="fill:var(--accent-ink)">Committer</text><text class="s" x="608.0" y="268" text-anchor="middle" style="fill:var(--accent-ink)">one batch commit</text><text class="s" x="608.0" y="282" text-anchor="middle" style="fill:var(--accent-ink)">again</text><rect class="node n-drv" x="753" y="224" width="261" height="66"/><text class="t" x="883.5" y="249" text-anchor="middle" style="fill:var(--driver-ink)">Back to checks</text><text class="s" x="883.5" y="268" text-anchor="middle" style="fill:var(--driver-ink)">then review, as in the main line</text><text class="s" x="883.5" y="282" text-anchor="middle" style="fill:var(--driver-ink)">the final checks can start one too</text><path class="ar" d="M223 257 H271" marker-end="url(#f5ar)"/><path class="ar" d="M463 257 H511" marker-end="url(#f5ar)"/><path class="ar" d="M703 257 H751" marker-end="url(#f5ar)"/><rect class="band" x="10" y="316" width="1020" height="130"/><text class="m" x="26" y="334">OTHER TURNS AND STOPS</text><rect class="node n-warn" x="33" y="346" width="300" height="86"/><text class="t" x="183.0" y="371" text-anchor="middle" >Builder stops early</text><text class="s" x="183.0" y="390" text-anchor="middle" >any stop but Done: timeout, budget,</text><text class="s" x="183.0" y="404" text-anchor="middle" >turn limit, crash, BLOCKED status</text><text class="s" x="183.0" y="418" text-anchor="middle" >parks BuilderStopped, no auto retry</text><rect class="node n-warn" x="353" y="346" width="300" height="86"/><text class="t" x="503.0" y="371" text-anchor="middle" >Nothing changed</text><text class="s" x="503.0" y="390" text-anchor="middle" >no diff after a build parks</text><text class="s" x="503.0" y="404" text-anchor="middle" >NothingChanged. After a fix round</text><text class="s" x="503.0" y="418" text-anchor="middle" >with green checks it passes on.</text><rect class="node n-agent" x="673" y="346" width="341" height="86"/><text class="t" x="843.5" y="371" text-anchor="middle" style="fill:var(--accent-ink)">factory rework</text><text class="s" x="843.5" y="390" text-anchor="middle" style="fill:var(--accent-ink)">you add a note, round count resets to 0</text><text class="s" x="843.5" y="404" text-anchor="middle" style="fill:var(--accent-ink)">all tasks done: builder resumed with it</text><text class="s" x="843.5" y="418" text-anchor="middle" style="fill:var(--accent-ink)">task pending: fresh builder gets the note</text><rect class="node n-ok" x="33" y="462" width="981" height="52"/><text class="cap" x="523" y="484" text-anchor="middle">Worst case with 3 tasks and the default settings: 16 agent runs, 18 if a sync message is needed.</text><text class="cap" x="523" y="500" text-anchor="middle">The 1,000,000 weighted token budget stops a run before that.</text><rect x="28" y="530" width="14" height="14" class="node n-agent"/><text class="cap" x="50" y="542">spends LLM tokens</text><rect x="198" y="530" width="14" height="14" class="node n-drv"/><text class="cap" x="220" y="542">Rust driver, no tokens</text><rect x="408" y="530" width="14" height="14" class="node n-warn"/><text class="cap" x="430" y="542">stops for a human</text></svg>