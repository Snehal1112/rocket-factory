<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A step-by-step walkthrough of the Rocket Factory CLI, from a fresh install to a merged feature."
    />
    <!--
      The Rocket Factory mark, inlined as a data URI rather than linked from
      public/. This page ships as one HTML file opened from disk, so a
      `href="/icon.svg"` would resolve to nothing the moment the file is
      emailed on. Kept in step with src/components/brand.tsx.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%230FA89A'/%3E%3Crect x='9' y='9' width='46' height='46' rx='10' fill='%230A6B62'/%3E%3Cpath d='M20 32H44' stroke='%23FFFFFF' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='32' r='4' fill='%230A6B62' stroke='%23FFFFFF' stroke-width='2.4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%230A6B62' stroke='%23FFFFFF' stroke-width='2.4'/%3E%3Ccircle cx='44' cy='32' r='4.6' fill='%23FFFFFF'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#0FA89A" />
    <title>Rocket Factory Journeybook</title>
    <script>
      // Applied before first paint so a dark-mode reader never sees a light
      // flash. The provider takes over from here.
      try {
        var t = localStorage.getItem("journeybook-theme") || "system"
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
