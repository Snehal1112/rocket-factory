# Changelog config for git-cliff, copied from rocket-mem. The parsers are
# case-insensitive, since this repo has some "Docs:" and "Style:" subjects.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  { message = "(?i)^feat", group = "Features" },
  { message = "(?i)^fix", group = "Bug Fixes" },
  { message = "(?i)^perf", group = "Performance" },
  { message = "(?i)^refactor", group = "Refactoring" },
  { message = "(?i)^doc", group = "Documentation" },
  { message = "(?i)^test", skip = true },
  { message = "(?i)^chore", skip = true },
  { message = "(?i)^revert", skip = true },
  { message = "(?i)^ci", skip = true },
  { message = "(?i)^style", skip = true },
]

filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
