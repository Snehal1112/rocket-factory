[workspace]
resolver = "2"
members = [
    "crates/factory-core",
    "crates/factory-git",
    "crates/factory-agent",
    "crates/factory-checks",
    "crates/factory-engine",
    "crates/factory-cli",
    "crates/factory-supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
fs2 = "0.4"
tempfile = "3"
