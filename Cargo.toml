[workspace]
resolver = "2"
members = [
    "crates/factory-core",
    "crates/factory-git",
    "crates/factory-agent",
    "crates/factory-checks",
    "crates/factory-engine",
    "crates/factory-cli",
    "crates/factory-supervisor",
    "crates/factory-telemetry",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
fs2 = "0.4"
tempfile = "3"
tiny_http = "0.12"
# Process lookups (alive, zombie, start time). Pinned: 0.39 needs Rust 1.95.
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry", "fmt", "std"] }
